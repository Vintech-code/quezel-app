services:
  - type: web
    name: quezel-app
    runtime: node
    plan: free
    buildCommand: >-
      composer install --no-dev --optimize-autoloader
      
      npm install
      
      npm run build
      
      php artisan config:cache
      
      php artisan route:cache
    startCommand: php -S 0.0.0.0:$PORT -t public
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://quezel-app.onrender.com
